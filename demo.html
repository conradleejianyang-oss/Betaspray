<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Relaxed CSP for standalone demo with inline script and CDN module import -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://unpkg.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://unpkg.com; connect-src 'self' https://unpkg.com; media-src 'self' data: blob:; font-src 'self';" />
    <title>Climber — Single File Demo</title>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      body { background: #0a0f1a; }
      #mobile-controls { position: fixed; inset: auto 0 0 0; display: flex; justify-content: space-between; padding: env(safe-area-inset-bottom) 12px 12px 12px; pointer-events: none; }
      .btn { pointer-events: auto; flex: 1; margin: 0 8px; height: 64px; border-radius: 12px; border: 2px solid #fff3; background: #ffffff14; color: #fff; font: 600 18px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; backdrop-filter: blur(6px); }
      .btn:active { background: #ffffff22; }
      @media (min-width: 900px) { #mobile-controls { display: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="mobile-controls" aria-hidden="false" role="group" aria-label="Climb controls">
      <button id="btn-left" class="btn" aria-label="Move left">⬅️ Left</button>
      <button id="btn-right" class="btn" aria-label="Move right">Right ➡️</button>
    </div>

    <script type="module">
      import kaboom from 'https://unpkg.com/kaboom/dist/kaboom.mjs';

      const GAME_CONFIG = {
        internalWidth: 360,
        internalHeight: 640,
        physicsTimestepMs: 16.6667,
        maxDtSeconds: 0.05,
        inputLockMs: 120,
        timeBar: { maxSeconds: 6, refillOnStepSeconds: 0.4, dangerThreshold: 0.15 },
        wall: { width: 160, segmentHeight: 40 },
        obstacles: { startChance: 0.55, endChance: 0.92, endScore: 80, maxSameSideInRow: 2 },
      };

      function initKaboom() {
        const k = kaboom({
          width: GAME_CONFIG.internalWidth,
          height: GAME_CONFIG.internalHeight,
          background: [196, 244, 248],
          global: false,
          touchToMouse: true,
          debug: true,
          stretch: true,
          letterbox: true,
          crisp: true,
          root: document.querySelector('#app'),
        });
        return { k };
      }

      // localStorage best score
      function loadBest() {
        const v = localStorage.getItem('climbtap_best');
        const n = v ? Number(v) : 0;
        return Number.isFinite(n) ? n : 0;
      }
      function saveBest(best) { localStorage.setItem('climbtap_best', String(best)); }

      // Input wiring (keyboard + mobile buttons)
      function setupInput(k, cbs) {
        const onLeft = () => cbs.onMove('left');
        const onRight = () => cbs.onMove('right');
        const onStart = () => cbs.onStart();
        const ctrls = [];
        ctrls.push(k.onKeyPress('a', onLeft));
        ctrls.push(k.onKeyPress('left', onLeft));
        ctrls.push(k.onKeyPress('d', onRight));
        ctrls.push(k.onKeyPress('right', onRight));
        ctrls.push(k.onKeyPress('space', onStart));
        ctrls.push(k.onKeyPress('enter', onStart));
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const add = (el, fn) => {
          if (!el) return () => {};
          const handler = (e) => { e.preventDefault(); fn(); };
          el.addEventListener('pointerdown', handler);
          return () => el.removeEventListener('pointerdown', handler);
        };
        const domUnsubLeft = add(btnLeft, onLeft);
        const domUnsubRight = add(btnRight, onRight);
        return () => { ctrls.forEach((c) => c.cancel()); domUnsubLeft(); domUnsubRight(); };
      }

      // Background (simplified, still animated clouds + trees band)
      function spawnBackground(k, viewSize, opts) {
        const clouds = [];
        const trees = [];
        const mountains = [];
        const rand = (min, max) => Math.random() * (max - min) + min;

        // Mountains
        const addRange = (count, baseY, color, zBase, minH, maxH, minW, maxW) => {
          const [r, g, b] = color;
          for (let i = 0; i < count; i++) {
            const t = (i + 0.5) / count;
            const x = t * viewSize.x + rand(-viewSize.x * 0.06, viewSize.x * 0.06);
            const height = rand(minH, maxH);
            const width = rand(minW, maxW);
            const stripes = Math.max(8, Math.ceil(height / 6));
            const roundnessExp = 0.65;
            const stripeH = Math.ceil(height / stripes) + 1;
            for (let s = 0; s < stripes; s++) {
              const frac = (s + 1) / stripes;
              let w = width * Math.pow(frac, roundnessExp);
              w += Math.sin(frac * Math.PI) * width * 0.03;
              w = Math.max(4, w);
              const h = stripeH;
              const rect = k.add([
                k.rect(w, h),
                k.pos(x, baseY - height + s * h),
                k.anchor('bot'),
                k.color(r, g, b),
                { z: zBase - i * 0.01 },
              ]);
              mountains.push(rect);
            }
          }
        };
        addRange(7, viewSize.y * 0.86, [140, 220, 190], -30, viewSize.y * 0.20, viewSize.y * 0.34, viewSize.x * 0.22, viewSize.x * 0.44);
        addRange(6, viewSize.y * 0.92, [120, 205, 175], -28, viewSize.y * 0.24, viewSize.y * 0.38, viewSize.x * 0.24, viewSize.x * 0.48);
        addRange(5, viewSize.y * 0.97, [100, 190, 160], -26, viewSize.y * 0.26, viewSize.y * 0.42, viewSize.x * 0.26, viewSize.x * 0.52);

        // Clouds
        for (let i = 0; i < 6; i++) {
          const width = rand(viewSize.x * 0.2, viewSize.x * 0.35);
          const c = k.add([
            k.rect(width, width * 0.3, { radius: width * 0.15 }),
            k.pos(rand(0, viewSize.x), rand(20, viewSize.y * 0.6)),
            k.color(255, 255, 255),
            k.opacity(0.25),
            { z: -20, speed: rand(5, 15) },
          ]);
          clouds.push(c);
        }

        // Ground strip and trees
        const treeBaseY = viewSize.y * 0.88;
        const ground = k.add([
          k.rect(viewSize.x, Math.max(10, viewSize.y - treeBaseY + 8), { radius: 6 }),
          k.pos(0, viewSize.y),
          k.anchor('botleft'),
          k.color(74, 52, 43),
          { z: -2 },
        ]);
        const clip = opts && opts.treeClip;
        const minX = clip ? clip.centerX - clip.width / 2 : 0;
        const maxX = clip ? clip.centerX + clip.width / 2 : viewSize.x;
        for (let i = 0; i < 12; i++) {
          const x = rand(minX + 10, maxX - 10);
          const scale = rand(0.8, 1.3);
          const trunk = k.add([
            k.rect(5 * scale, 18 * scale, { radius: 2 }),
            k.pos(x, treeBaseY),
            k.anchor('bot'),
            k.color(84, 60, 44),
            { z: -1.5 },
          ]);
          const stripes = 5;
          for (let s = 0; s < stripes; s++) {
            const frac = (s + 1) / stripes;
            const w = 26 * scale * frac;
            const h = 6 * scale;
            const y = treeBaseY - 18 * scale - s * h + 2 * scale;
            const leaf = k.add([
              k.rect(w, h, { radius: 3 }),
              k.pos(x, y),
              k.anchor('center'),
              k.color(40 + s * 4, 120 + s * 3, 80),
              { z: -1.45 },
            ]);
            trees.push(leaf);
          }
          trees.push(trunk);
        }

        k.onUpdate(() => {
          for (const c of clouds) {
            const s = c.speed ?? 10;
            c.move(s, 0);
            const pos = c.pos;
            const width = c.width;
            if (pos.x - width / 2 > viewSize.x + 10) {
              c.pos.x = -10 - width / 2;
              c.pos.y = rand(20, viewSize.y * 0.6);
            }
          }
        });

        return { clouds, trees, mountains, ground };
      }

      // Rock wall with scrolling bands and lane helpers
      function spawnRockWall(k, centerX, viewH, width, bandH) {
        const baseColor = k.rgb(110, 104, 96);
        const bandCount = Math.ceil(viewH / bandH) + 4;
        const leftOffsets = [];
        const rightOffsets = [];
        let curL = 0, curR = 0;
        const maxJitter = width * 0.12;
        for (let i = 0; i < bandCount; i++) {
          curL += (Math.random() - 0.5) * (width * 0.06);
          curR += (Math.random() - 0.5) * (width * 0.06);
          curL = Math.max(-maxJitter, Math.min(maxJitter, curL));
          curR = Math.max(-maxJitter, Math.min(maxJitter, curR));
          leftOffsets.push(curL);
          rightOffsets.push(curR);
        }
        const edgesAt = (y) => {
          const idx = Math.max(0, Math.min(bandCount - 1, Math.floor(y / bandH)));
          const lOff = leftOffsets[idx] ?? 0;
          const rOff = rightOffsets[idx] ?? 0;
          const left = centerX - width / 2 + lOff;
          const right = centerX + width / 2 + rOff;
          return { left, right };
        };
        const laneXAt = (y, side) => {
          const { left, right } = edgesAt(y);
          const w = right - left;
          const margin = w * 0.25;
          return side === 'left' ? left + margin : right - margin;
        };
        const bands = [];
        const root = k.add([k.pos(0, 0)]);
        for (let i = 0; i < bandCount; i++) {
          const yMid = -bandH / 2 + i * bandH;
          const { left, right } = edgesAt(yMid);
          const w = right - left;
          const o = root.add([
            k.rect(w, bandH + 4),
            k.pos((left + right) / 2, yMid),
            k.anchor('center'),
            k.color(baseColor),
            k.z(0),
          ]);
          bands.push(o);
        }
        function spawnTopBand() {
          const topL = leftOffsets[0] ?? 0;
          const topR = rightOffsets[0] ?? 0;
          let nextL = topL + (Math.random() - 0.5) * (width * 0.06);
          let nextR = topR + (Math.random() - 0.5) * (width * 0.06);
          nextL = Math.max(-maxJitter, Math.min(maxJitter, nextL));
          nextR = Math.max(-maxJitter, Math.min(maxJitter, nextR));
          leftOffsets.unshift(nextL); rightOffsets.unshift(nextR);
          leftOffsets.pop(); rightOffsets.pop();
          const yMid = (bands[0]?.pos.y ?? -bandH / 2) - bandH;
          const { left, right } = edgesAt(0);
          const w = right - left;
          const o = root.add([
            k.rect(w, bandH + 4),
            k.pos((left + right) / 2, yMid),
            k.anchor('center'),
            k.color(baseColor),
            k.z(0),
          ]);
          bands.unshift(o);
          const last = bands.pop();
          last?.destroy();
        }
        function scrollOnce(duration) {
          return new Promise((resolve) => {
            const startY = root.pos.y;
            k.tween(startY, startY + bandH, duration, (v) => (root.pos.y = v), k.easings.linear).then?.(() => {
              root.pos.y = 0;
              for (const b of bands) b.pos.y += bandH;
              spawnTopBand();
              resolve();
            });
          });
        }
        return { root, laneXAt, edgesAt, scrollOnce };
      }

      // Climber model and motion
      function spawnClimber(k, wallCenterX, baseY, modelScale = 1) {
        const s = modelScale;
        const laneOffset = GAME_CONFIG.wall.width * 0.25;
        const leftX = wallCenterX - laneOffset;
        const rightX = wallCenterX + laneOffset;
        const root = k.add([k.pos(leftX, baseY), k.anchor('center'), k.z(10)]);
        const shirtColor = k.rgb(28, 120, 200);
        const skin = k.rgb(250, 215, 170);
        const hairColor = k.rgb(60, 40, 30);
        const pants = k.rgb(170, 120, 40);
        const shoe = k.rgb(22, 26, 30);
        const harnessRed = k.rgb(180, 50, 40);
        const beltColor = k.rgb(200, 80, 40);
        const ropeColor = k.rgb(230, 110, 40);
        const bodyW = 24 * s, bodyH = 30 * s;
        const body = k.add([k.rect(bodyW, bodyH, { radius: 2 * s }), k.pos(0, 0), k.color(shirtColor), k.anchor('center'), k.z(11), k.rotate(0)]);
        const neck = k.add([k.rect(8 * s, 4 * s, { radius: 1 * s }), k.pos(0, -(bodyH / 2 + 6 * s)), k.anchor('center'), k.color(skin), k.z(12)]);
        const headRadius = 8 * s;
        const head = k.add([k.rect(14 * s, 14 * s, { radius: 1 * s }), k.pos(0, -(bodyH / 2 + 14 * s)), k.anchor('center'), k.color(skin), k.z(13)]);
        const hair = k.add([k.rect(16 * s, 16 * s), k.pos(-2 * s, -(bodyH / 2 + 16 * s)), k.anchor('center'), k.color(hairColor), k.z(14)]);
        const belt = k.add([k.rect(bodyW, 5 * s, { radius: 1 * s }), k.pos(0, bodyH / 2 - 7 * s), k.anchor('center'), k.color(beltColor), k.z(12)]);
        const harnessL = k.add([k.rect(10 * s, 8 * s, { radius: 2 * s }), k.pos(-6 * s, bodyH / 2 - 2 * s), k.anchor('center'), k.color(harnessRed), k.z(12)]);
        const harnessR = k.add([k.rect(10 * s, 8 * s, { radius: 2 * s }), k.pos(6 * s, bodyH / 2 - 2 * s), k.anchor('center'), k.color(harnessRed), k.z(12)]);
        const legLeft = k.add([k.rect(10 * s, 28 * s, { radius: 1 * s }), k.pos(-7 * s, bodyH / 2), k.anchor('top'), k.color(pants), k.z(10)]);
        const legRight = k.add([k.rect(10 * s, 28 * s, { radius: 1 * s }), k.pos(7 * s, bodyH / 2), k.anchor('top'), k.color(pants), k.z(10)]);
        const footLeft = k.add([k.rect(10 * s, 6 * s, { radius: 1 * s }), k.pos(-7 * s, bodyH / 2 + 28 * s), k.anchor('top'), k.color(shoe), k.z(10)]);
        const footRight = k.add([k.rect(10 * s, 6 * s, { radius: 1 * s }), k.pos(7 * s, bodyH / 2 + 28 * s), k.anchor('top'), k.color(shoe), k.z(10)]);
        const armLeft = k.add([k.rect(6 * s, 28 * s, { radius: 1 * s }), k.pos(-12 * s, -(bodyH / 2)), k.anchor('bot'), k.color(skin), k.z(12), k.rotate(0)]);
        const armRight = k.add([k.rect(6 * s, 28 * s, { radius: 1 * s }), k.pos(12 * s, -(bodyH / 2)), k.anchor('bot'), k.color(skin), k.z(12), k.rotate(0)]);
        const rope = k.add([k.rect(2 * s, 80 * s), k.pos(0, -36 * s), k.anchor('top'), k.color(ropeColor), k.z(9), k.rotate(0)]);
        const climber = {
          root, body, head, hair, neck, belt, harness: harnessL, legLeft, legRight, footLeft, footRight, armLeft, armRight, rope,
          side: 'left', jitterTime: 0, leftX, rightX, baseY: baseY, armReachLeft: 0, armReachRight: 0, headRadius, scale: s,
        };
        k.onUpdate(() => {
          const t = k.time();
          const sway = Math.sin(t * 2) * 1.3;
          body.angle = sway; rope.angle = sway * 0.6;

          // Idle breathing: 2s cycle, subtle vertical motion
          const breathe = Math.sin(Math.PI * t);
          const breathOffset = breathe * 2; // px

          // Small head movements: gentle tilt and micro sway
          const headTilt = Math.sin(t * 2.6) * 3; // deg
          const headSwayX = Math.sin(t * 1.8) * 1.2; // px

          climber.jitterTime += k.dt();
          const j = Math.sin(climber.jitterTime * 18) * 0.8;
          const rp = climber.root.pos;

          // Torso and attached parts follow breathing offset
          body.pos = k.vec2(rp.x, rp.y + breathOffset);
          neck.pos = k.vec2(rp.x, rp.y + breathOffset - (bodyH / 2 + 6 * s));
          head.pos = k.vec2(rp.x + headSwayX, rp.y + breathOffset - (bodyH / 2 + 14 * s));
          head.angle = headTilt;
          hair.pos = k.vec2(rp.x - 2 * s + headSwayX * 0.6, rp.y + breathOffset - (bodyH / 2 + 16 * s));
          hair.angle = headTilt * 0.9;
          belt.pos = k.vec2(rp.x, rp.y + breathOffset + bodyH / 2 - 7 * s);
          harnessL.pos = k.vec2(rp.x - 6 * s, rp.y + breathOffset + bodyH / 2 - 2 * s);
          harnessR.pos = k.vec2(rp.x + 6 * s, rp.y + breathOffset + bodyH / 2 - 2 * s);

          // Legs remain planted
          legLeft.pos = k.vec2(rp.x - 7 * s, rp.y + bodyH / 2);
          legRight.pos = k.vec2(rp.x + 7 * s, rp.y + bodyH / 2);
          footLeft.pos = k.vec2(rp.x - 7 * s, rp.y + bodyH / 2 + 28 * s);
          footRight.pos = k.vec2(rp.x + 7 * s, rp.y + bodyH / 2 + 28 * s);

          // Rope slightly follows breathing
          rope.pos = k.vec2(rp.x, rp.y + breathOffset * 0.5 - 36 * s);

          const leftJit = climber.side === 'left' ? j : 0;
          const rightJit = climber.side === 'right' ? j : 0;
          const armsBaseY = rp.y + breathOffset - bodyH / 2;
          climber.armLeft.pos = k.vec2(rp.x - 12 * s + leftJit, armsBaseY - climber.armReachLeft);
          climber.armRight.pos = k.vec2(rp.x + 12 * s + rightJit, armsBaseY - climber.armReachRight);
        });
        return climber;
      }
      function estimateClimberHeightPx(scale) { return 72 * scale; }
      function reachToSide(k, climber, side) {
        const targetX = side === 'left' ? climber.leftX : climber.rightX;
        climber.side = side;
        const duration = GAME_CONFIG.inputLockMs / 1000;
        k.tween(climber.root.pos.x, targetX, duration, (v) => (climber.root.pos.x = v), k.easings.easeOutCubic);
        const reachDur = duration * 0.5;
        const pullDur = duration * 0.5;
        const pullHeight = 8;
        if (side === 'left') {
          const fromA = climber.armLeft.angle ?? 0;
          const reachTw = k.tween(fromA, -60, reachDur * 0.8, (v) => (climber.armLeft.angle = v), k.easings.easeOutCubic);
          reachTw.then?.(() => k.tween(climber.armLeft.angle, 0, pullDur * 0.8, (v) => (climber.armLeft.angle = v), k.easings.easeOutCubic));
          const reachTarget = climber.headRadius * 2;
          k.tween(climber.armReachLeft, reachTarget, reachDur, (v) => (climber.armReachLeft = v), k.easings.linear).then?.(() => {
            k.tween(climber.armReachLeft, 0, pullDur, (v) => (climber.armReachLeft = v), k.easings.easeInCubic);
            const y0 = climber.root.pos.y;
            k.tween(y0, y0 - pullHeight, pullDur * 0.6, (v) => (climber.root.pos.y = v), k.easings.easeOutCubic).then?.(() => {
              k.tween(climber.root.pos.y, y0, pullDur * 0.4, (v) => (climber.root.pos.y = v), k.easings.easeInCubic);
            });
          });
        } else {
          const fromA = climber.armRight.angle ?? 0;
          const reachTw = k.tween(fromA, 60, reachDur * 0.8, (v) => (climber.armRight.angle = v), k.easings.easeOutCubic);
          reachTw.then?.(() => k.tween(climber.armRight.angle, 0, pullDur * 0.8, (v) => (climber.armRight.angle = v), k.easings.easeOutCubic));
          const reachTarget = climber.headRadius * 2;
          k.tween(climber.armReachRight, reachTarget, reachDur, (v) => (climber.armReachRight = v), k.easings.linear).then?.(() => {
            k.tween(climber.armReachRight, 0, pullDur, (v) => (climber.armReachRight = v), k.easings.easeInCubic);
            const y0 = climber.root.pos.y;
            k.tween(y0, y0 - pullHeight, pullDur * 0.6, (v) => (climber.root.pos.y = v), k.easings.easeOutCubic).then?.(() => {
              k.tween(climber.root.pos.y, y0, pullDur * 0.4, (v) => (climber.root.pos.y = v), k.easings.easeInCubic);
            });
          });
        }
      }

      // Obstacles and RNG
      function createRng(seed = Math.random() * 1e9) {
        let x = (seed | 0) || 123456789;
        return () => { x ^= x << 13; x ^= x >>> 17; x ^= x << 5; return ((x >>> 0) % 100000) / 100000; };
      }
      function nextObstacle(score, lastSide, sameSideRun, rng) {
        let side = rng() < 0.5 ? 'left' : 'right';
        if (lastSide && sameSideRun >= GAME_CONFIG.obstacles.maxSameSideInRow) side = lastSide === 'left' ? 'right' : 'left';
        const newRun = lastSide === side ? sameSideRun + 1 : 1;
        return { side, newRun, newLast: side };
      }
      function seedInitialSegments(count, rng) {
        const segs = []; let last = null; let run = 0;
        for (let i = 0; i < count; i++) { const n = nextObstacle(0, last, run, rng); segs.push({ side: n.side }); last = n.newLast; run = n.newRun; }
        return segs;
      }

      // HUD
      function createHud(k) {
        const padding = 10;
        const scoreText = k.add([k.text('0', { size: 24, font: 'sink' }), k.pos(padding, padding), k.z(1000), k.color(255, 255, 255)]);
        const barWidth = k.width() - padding * 2;
        const barHeight = 10;
        k.add([k.rect(barWidth, barHeight), k.pos(padding, padding + 30), k.color(255, 255, 255), k.opacity(0.12), k.z(1000)]);
        const timeBar = k.add([k.rect(barWidth, barHeight), k.pos(padding, padding + 30), k.color(80, 200, 120), k.z(1001)]);
        timeBar.fullWidth = barWidth;
        function setTime(t) {
          const frac = Math.max(0, Math.min(1, t / GAME_CONFIG.timeBar.maxSeconds));
          timeBar.width = timeBar.fullWidth * frac;
          const danger = frac < GAME_CONFIG.timeBar.dangerThreshold;
          timeBar.color = danger ? k.rgb(230, 70, 70) : k.rgb(80, 200, 120);
        }
        function setScore(score, best) { scoreText.text = `${score} (best ${best})`; }
        return { setScore, setTime };
      }

      function defineMenuScene(k) {
        k.scene('menu', () => {
          const viewW = k.width();
          const viewH = k.height();
          const wallCenterX = viewW / 2;
          spawnBackground(k, k.vec2(viewW, viewH), { treeClip: { centerX: wallCenterX, width: GAME_CONFIG.wall.width } });
          const bandH = Math.floor(viewH / 7);
          spawnRockWall(k, wallCenterX, viewH, GAME_CONFIG.wall.width, bandH);
          const startScale = 1.8 * 1.10;
          const climberHeight = estimateClimberHeightPx(startScale);
          const y = viewH - Math.max(120, climberHeight * 1.1);
          spawnClimber(k, wallCenterX, y, startScale);

          // Try to show betaspray logo image if present locally; else fallback text
          (async () => {
            const candidates = [
              './assets/betaspray.png',
              './assets/betaspray.webp',
              './public/assets/betaspray.png',
              './public/assets/betaspray.webp',
              '/assets/betaspray.png',
              '/assets/betaspray.webp',
            ];
            let loaded = false;
            for (const p of candidates) {
              try {
                await k.loadSprite('menu_logo', p);
                const logo = k.add([k.sprite('menu_logo'), k.pos(viewW / 2, viewH * 0.18), k.anchor('center'), { z: 2000 }]);
                const desired = viewW * 0.8;
                const w = (logo && logo.width) ? logo.width : desired;
                const s = Math.min(1.0, desired / w);
                logo.scale = s;
                loaded = true;
                break;
              } catch (_) {
                // try next
              }
            }
            if (!loaded) {
              k.add([k.text('betaspray.', { size: 72 }), k.pos(viewW / 2, viewH * 0.18), k.anchor('center'), k.color(38, 58, 66), { z: 2000 }]);
            }
          })();
          k.add([k.text('Tap Space/Enter/Click to Start', { size: 28, width: viewW - 40, align: 'center' }), k.pos(viewW / 2, viewH - 40), k.anchor('center'), k.color(255, 255, 255), k.z(2000)]);
          const start = () => k.go('game', { autoStart: true });
          ['space', 'enter', 'left', 'right', 'a', 'd'].forEach((key) => k.onKeyPress(key, start));
          k.onClick(start);
        });
      }

      function defineGameScene(k) {
        k.scene('game', (opts) => {
          const viewW = k.width();
          const viewH = k.height();
          const wallCenterX = viewW / 2;
          spawnBackground(k, k.vec2(viewW, viewH), { treeClip: { centerX: wallCenterX, width: GAME_CONFIG.wall.width } });
          const wallTop = 50;
          const wallBottom = viewH - 40;
          const climberScale = 1.15 * 1.10;
          const climberHeight = estimateClimberHeightPx(climberScale);
          const segmentH = Math.max(50, Math.floor(viewH / 7));
          const numSegmentsOnScreen = Math.ceil((wallBottom - wallTop) / segmentH) + 2;
          const INDICATOR_RADIUS = 10;
          const INDICATOR_Y_RATIO = -0.25;
          const rock = spawnRockWall(k, wallCenterX, viewH, GAME_CONFIG.wall.width, segmentH);
          const obstaclesLayer = k.add([k.pos(0, 0), k.z(1)]);
          const rng = createRng();
          let state = {
            phase: 'READY', score: 0, best: loadBest(), timeRemaining: GAME_CONFIG.timeBar.maxSeconds, playerSide: 'left',
            segments: seedInitialSegments(numSegmentsOnScreen + 5, rng), sameSideRun: 0, lastObstacleSide: null, inputLockedUntilMs: 0,
          };
          const hud = createHud(k);
          hud.setTime(state.timeRemaining);
          hud.setScore(0, state.best);

          const pauseBtn = k.add([k.text('II', { size: 20 }), k.pos(viewW - 20, 10), k.anchor('topright'), k.area(), k.z(1500), k.color(255, 255, 255)]);
          pauseBtn.onClick(() => { if (state.phase === 'PLAY') setPhase('PAUSED'); });

          const climberBaseY = wallBottom - segmentH * 1.2 + (viewH * 0.10);
          const climber = spawnClimber(k, wallCenterX, climberBaseY, climberScale);

          const segmentNodes = [];
          let currentIndicator = null;
          let hasSkippedFirstIndicator = false;
          function drawSegments() {
            for (const n of segmentNodes) n.destroy();
            segmentNodes.length = 0; currentIndicator = null;
            const nextIdx = getNextSegmentIndex();
            for (let i = 0; i < numSegmentsOnScreen + 2; i++) {
              const seg = state.segments[i];
              if (!seg || !seg.side) continue;
              const baseY = wallBottom - i * segmentH - segmentH / 2;
              const yPos = baseY + INDICATOR_Y_RATIO * segmentH - viewH * 0.10;
              const xPos = rock.laneXAt(yPos, seg.side);
              // Skip only the very first red circle generated in the game
              if (!hasSkippedFirstIndicator) {
                hasSkippedFirstIndicator = true;
                continue;
              }
              const c = obstaclesLayer.add([k.circle(INDICATOR_RADIUS), k.pos(xPos, yPos), k.anchor('center'), k.color(230, 60, 60), k.opacity(0.95), k.z(1.2)]);
              segmentNodes.push(c);
              if (i === nextIdx) currentIndicator = c;
            }
          }
          drawSegments();

          function getTargetY() {
            const s = climber.scale ?? 1;
            const reachTarget = climber.headRadius * 2;
            const armBase = 18 * s;
            const holdOffset = armBase + reachTarget * 0.9;
            return climber.root.pos.y - holdOffset;
          }
          function getNextSegmentIndex() {
            const targetY = getTargetY();
            let bestIdx = 0; let bestDelta = Number.POSITIVE_INFINITY;
            for (let i = 0; i < state.segments.length; i++) {
              const seg = state.segments[i];
              if (!seg || !seg.side) continue;
              const baseY = wallBottom - i * segmentH - segmentH / 2;
              const yPos = baseY + INDICATOR_Y_RATIO * segmentH - viewH * 0.10;
              const delta = targetY - yPos;
              if (delta > 0 && delta < bestDelta) { bestDelta = delta; bestIdx = i; }
            }
            return bestIdx;
          }

          const overlay = k.add([k.rect(viewW, viewH), k.pos(0, 0), k.color(0, 0, 0), k.opacity(0.25), k.z(2000)]);
          const overlayText = k.add([k.text('Tap Space/Enter to Start', { size: 24, width: viewW - 40, align: 'center' }), k.pos(viewW / 2, viewH / 2), k.anchor('center'), k.z(2001), k.color(255, 255, 255)]);

          let resumeBtn = null; let menuBtn = null;
          function destroyPauseMenu() { resumeBtn?.destroy(); menuBtn?.destroy(); resumeBtn = null; menuBtn = null; }
          function showPauseMenu() {
            if (resumeBtn) return;
            resumeBtn = k.add([k.text('Resume', { size: 28 }), k.pos(viewW / 2, viewH / 2 - 10), k.anchor('center'), k.color(255, 255, 255), k.z(2100), k.area()]);
            menuBtn = k.add([k.text('Main Menu', { size: 24 }), k.pos(viewW / 2, viewH / 2 + 30), k.anchor('center'), k.color(255, 255, 255), k.z(2100), k.area()]);
            resumeBtn.onClick?.(() => setPhase('PLAY'));
            menuBtn.onClick?.(() => k.go('menu'));
          }

          function setPhase(phase, reason) {
            state.phase = phase;
            if (phase === 'READY') { overlay.hidden = false; overlayText.hidden = false; overlayText.text = 'Tap Space/Enter to Start'; }
            else if (phase === 'PLAY') { overlay.hidden = true; overlayText.hidden = true; destroyPauseMenu(); }
            else if (phase === 'OVER') {
              overlay.hidden = false; overlayText.hidden = false;
              const best = Math.max(state.best, state.score);
              if (best !== state.best) { state.best = best; saveBest(best); }
              overlayText.text = `${reason ?? 'Pumped out!'}\nScore ${state.score}  •  Best ${state.best}\nPress Space/Enter to Restart`;
            } else if (phase === 'PAUSED') { overlay.hidden = false; overlayText.hidden = false; overlayText.text = 'Paused'; showPauseMenu(); }
          }

          function refillTime() {
            state.timeRemaining = Math.min(GAME_CONFIG.timeBar.maxSeconds, state.timeRemaining + GAME_CONFIG.timeBar.refillOnStepSeconds);
            hud.setTime(state.timeRemaining);
          }

          let isScrolling = false;
          function scrollUp() {
            if (isScrolling) return; isScrolling = true;
            const duration = 0.15; const startY = obstaclesLayer.pos.y;
            const tw = k.tween(startY, startY + segmentH, duration, (v) => (obstaclesLayer.pos.y = v), k.easings.linear);
            const rockTw = rock.scrollOnce(duration);
            tw.then?.(() => {
              obstaclesLayer.pos.y = 0;
              state.segments.shift();
              const n = nextObstacle(state.score, state.lastObstacleSide, state.sameSideRun, rng);
              state.segments.push({ side: n.side });
              state.lastObstacleSide = n.newLast; state.sameSideRun = n.newRun;
              drawSegments(); isScrolling = false;
            });
          }

          function handleMove(side) {
            if (state.phase !== 'PLAY') return;
            if (isScrolling) return;
            const now = performance.now();
            if (now < state.inputLockedUntilMs) return;
            state.inputLockedUntilMs = now + GAME_CONFIG.inputLockMs;
            const nextSeg = state.segments[getNextSegmentIndex()];
            if (nextSeg && nextSeg.side !== side) { setPhase('OVER', `Wrong hold — use ${nextSeg.side}!`); return; }
            state.playerSide = side;
            reachToSide(k, climber, side);
            state.score += 1; hud.setScore(state.score, state.best);
            refillTime();
            if (navigator.vibrate) navigator.vibrate(15);
            scrollUp();
          }
          function handleStart() {
            if (state.phase === 'READY' || state.phase === 'OVER') {
              state.score = 0; state.timeRemaining = GAME_CONFIG.timeBar.maxSeconds; state.playerSide = 'left';
              state.segments = seedInitialSegments(numSegmentsOnScreen + 5, rng);
              state.sameSideRun = 0; state.lastObstacleSide = null;
              hud.setScore(0, state.best); hud.setTime(state.timeRemaining);
              drawSegments(); setPhase('PLAY');
            }
          }

          const detachInput = setupInput(k, { onMove: handleMove, onStart: handleStart });
          if (opts && opts.autoStart) setPhase('PLAY');

          k.onUpdate(() => {
            if (state.phase !== 'PLAY') return;
            const dt = Math.min(GAME_CONFIG.maxDtSeconds, k.dt());
            state.timeRemaining -= dt; hud.setTime(state.timeRemaining);
            if (state.timeRemaining <= 0) setPhase('OVER', 'Pumped out!');
          });
          k.onSceneLeave(() => detachInput());
        });
      }

      const { k } = initKaboom();
      defineGameScene(k);
      defineMenuScene(k);
      k.go('menu');
    </script>
  </body>
</html>
